name: DiffAtlas 3-OS Cleanroom CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install zero-native-addon dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full verification (typecheck + build + Vitest + cleanroom self-audit)
        run: npm run verify

      - name: Verify cross-platform standalone plugin release packager
        run: npm run package:release -- ci-dryrun

      - name: Upload build_verification.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-verification-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/build_verification.json
          if-no-files-found: warn
